# october/cyber — WayFamily for incident-driven security ways (ways/v1alpha1).
#
# `ways add` requires this file at the repo root and installs, as one plan, the member
# ways in spec.members plus the shared payload (skills, slots, requires). A family has
# no flow of its own: each member keeps its phases and gates.
#
# The flow-driving skill lives at the family level. A member way is installed from its
# own directory and cannot reference paths that escape it (`..`). See ways/README.md.
#
# Validate:  ways validate way.yaml ways/node-oct-2026/way.yaml
#            ways conformance way.yaml
# Install:   ways add github:Incubator-it/october-cyber-family
apiVersion: ways/v1alpha1
kind: WayFamily
metadata:
  name: october/cyber
  displayName: October Cyber
  version: 0.1.0
  description: Incident-driven security ways. The first member audits and, only when something is affected, patches a Node.js repo for the October 2026 Security Release.
  discipline: security
  publisher: incubator
  homepage: https://github.com/Incubator-it/october-cyber-family
  keywords: [nodejs, security, cve-2026-111497, brotli, october-2026]

spec:
  members:
    - { id: node-oct-2026, path: ways/node-oct-2026 } # october/node-oct-2026 → skills/node-october-2026-security

  skills:
    - { id: node-october-2026-security, path: skills/node-october-2026-security, uses: [vcs-host] }

  requires:
    cli:
      - name: git
        check: git --version
        required: true
      - name: gh
        check: gh --version
        versionConstraint: '>=2.0.0'
        install: 'https://cli.github.com'
        required: true
        capability: vcs-host

  needs:
    - id: vcs-host
      displayName: Version-control host
      description: Hosts the repo and the security pull request opened by node-october-2026-security when a target is affected.
      contract: ways.dev/vcs-host@1
      required: true
      cardinality: single
      providerSource: environment
      options: [github, gitlab, bitbucket]

  defaults:
    bindings:
      vcs-host: github
